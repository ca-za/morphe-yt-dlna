[package]
name = "ytdlna-desktop"
version = "0.1.0"
edition = "2021"
description = "Casts YouTube videos from a desktop computer to DLNA renderers (prototype)"
license = "GPL-3.0-only"
publish = false

[dependencies]
ytdlna-proxy = { path = "../ytdlna-proxy" }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
souvlaki = "0.8"
core-foundation = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
