<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <section>
    <label for="renderer">Gerät</label>
    <div class="row">
      <select id="renderer"></select>
      <button id="discover" title="Geräte suchen">Suchen</button>
    </div>
    <p id="hidden" class="muted" hidden></p>
    <button id="cast" class="primary">Diesen Tab abspielen</button>
  </section>
  <section id="now" hidden>
    <div id="title"></div>
    <div id="meta" class="muted"></div>
    <div class="row">
      <span id="time" class="muted"></span>
      <span class="spacer"></span>
      <button id="toggle">Pause</button>
      <button id="stop">Stopp</button>
    </div>
    <label class="volume">Lautstärke <input id="volume" type="range" min="0" max="100" step="1"></label>
  </section>
  <p id="error" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
