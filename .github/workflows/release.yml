name: Release

on:
  workflow_dispatch:
  push:

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # The stream proxy is Rust, cross-compiled for Android with the runner's NDK.
      - name: Setup Rust for Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # dev: v0.1.<n>-alpha, every release counts the last number up (our own script).
      - name: Release (dev)
        if: github.ref == 'refs/heads/dev'
        id: dev_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release_dev.sh

      # main (stable releases): semantic release runs its own Gradle build command.
      - name: Release (main)
        if: github.ref == 'refs/heads/main'
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true' || steps.dev_release.outputs.released == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag || steps.dev_release.outputs.tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      # Always verify compilation when no release was published.
      # This covers other branches, chore commits, docs commits, etc.
      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true' && steps.dev_release.outputs.released != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid clean --no-daemon
